<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="通勤助手" />
    <title>通勤助手</title>
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("commute_bus_routes_v2") || "{}");
          if (stored.theme === "light") document.documentElement.dataset.theme = "light";
        } catch (error) {}
      })();
    </script>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
